name: Validar landing page

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Site, JavaScript e integração
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Executar validação
        run: python3 scripts/validate_site.py

      - name: Validar JavaScript e migração da planilha
        run: |
          node --check gamboas/app.js
          node scripts/test_apps_script_migration.js
